[project]
name = "storage"
version = "0.1.0"
description = "Reusable storage abstraction with S3 implementation."
authors = [
    { name="Jiří Matějka", email="jiri.ma2@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "boto3~=1.34.141",
    "botocore~=1.34.154"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
